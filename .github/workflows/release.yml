name: release

# Собирает установщики для трёх платформ и выкладывает их в Releases.
# Запуск: git tag v0.1.0 && git push --tags
#
# На обычные коммиты не реагирует намеренно: минуты macOS-раннера списываются
# с коэффициентом 10, а публиковать нечего. Проверить сборку без выпуска
# релиза можно вручную — Actions → release → Run workflow: соберутся все три
# платформы, а publish пропустится (он требует тега).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14          # arm64 — целевая платформа Apple Silicon
    # На уровне job — иначе `if: env.MACOS_CERTIFICATE` не увидит значение:
    # env шага применяется уже после вычисления его условия
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # build_dmg.sh берёт список файлов из git

      # Сертификат живёт во временной связке ключей, которая умирает вместе с
      # раннером. Шаг пропускается, если секретов нет — тогда сборка просто
      # подписывается ad-hoc и остаётся рабочей.
      - name: Подключить сертификат Developer ID
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          # Без этого codesign будет спрашивать разрешение и повиснет
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Собрать .dmg
        run: |
          chmod +x packaging/macos/build_dmg.sh
          packaging/macos/build_dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Убрать связку ключей
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Собрать установщик
        shell: pwsh
        run: |
          # При ручном прогоне GITHUB_REF_NAME — имя ветки, версией это быть не может
          $version = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ($version -notmatch '^\d+\.\d+') { $version = '0.0.0-dev' }
          .\packaging\windows\build_installer.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Собрать архив
        run: |
          # При ручном прогоне здесь имя ветки, а не версия
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+ ]] || version="0.0.0-dev"
          mkdir -p dist "dist/video-dub-$version"
          git archive HEAD | tar -C "dist/video-dub-$version" -xf -
          tar -C dist -czf "dist/video-dub-$version-linux.tar.gz" "video-dub-$version"
          rm -rf "dist/video-dub-$version"
          cp install.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/*.tar.gz
            dist/install.sh

  # Проверяем, что скрипты не сломаны, до того как они попадут в релиз
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/bootstrap.sh install.sh packaging/macos/build_dmg.sh
      - name: Синтаксис PowerShell
        shell: pwsh
        run: |
          foreach ($f in 'scripts/bootstrap.ps1','packaging/windows/build_installer.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "$f содержит синтаксические ошибки" }
            Write-Host "ok $f"
          }

  publish:
    needs: [macos, windows, linux, lint-scripts]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Описание выпуска лежит в репозитории. Забираем его до артефактов:
      # checkout вычищает рабочую папку и снёс бы уже скачанные файлы
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
